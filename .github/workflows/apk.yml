name: APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MSF HomeDesk APK
    runs-on: ubuntu-latest
    env:
      CAPACITOR_SERVER_URL: ${{ vars.MSF_PORTAL_URL || 'https://msf-homedesk.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/msf-homedesk.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/msf-homedesk.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: bun run apk:build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: msf-homedesk-apk
          path: |
            MSF-Homedesk.apk
            build-artifacts/*.apk
          retention-days: 30
