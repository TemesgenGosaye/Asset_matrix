<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#ffffff" />
<title>HomeDesk • Connection</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #0f172a;
    --muted: #475569;
    --faint: #94a3b8;
    --line: #e2e8f0;
    --brand: #0284c7;
    --brand-dark: #0369a1;
    --ok: #16a34a;
    --bad: #e11d48;
    --wait: #0284c7;
    --idle: #cbd5e1;
    --surface: #f8fafc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220;
      --ink: #f1f5f9;
      --muted: #94a3b8;
      --faint: #64748b;
      --line: #1e293b;
      --brand: #38bdf8;
      --brand-dark: #7dd3fc;
      --ok: #4ade80;
      --bad: #fb7185;
      --wait: #38bdf8;
      --idle: #334155;
      --surface: #111a2e;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Ethiopic", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .stage {
    flex: 1; width: 100%; max-width: 400px; margin: 0 auto;
    padding: 2.5rem 1.5rem 1rem;
    display: flex; flex-direction: column; justify-content: center;
  }

  /* Connection path: the one memorable element */
  .path {
    display: grid; grid-template-columns: auto 1fr auto 1fr auto; align-items: center;
    gap: .5rem; margin-bottom: 2rem;
  }
  .node { display: flex; flex-direction: column; align-items: center; gap: .5rem; width: 64px; }
  .node .dot {
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    border: 2px solid var(--idle); color: var(--idle);
    background: var(--bg);
    transition: border-color .3s, color .3s, background .3s;
  }
  .node svg { width: 22px; height: 22px; }
  .node .name { font-size: .7rem; font-weight: 600; color: var(--muted); text-align: center; line-height: 1.25; }
  .link { height: 2px; background: var(--idle); border-radius: 2px; position: relative; overflow: hidden; transition: background .3s; margin-bottom: 1.4rem; }
  .node[data-s="ok"] .dot   { border-color: var(--ok);   color: var(--ok); }
  .node[data-s="bad"] .dot  { border-color: var(--bad);  color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--bg)); }
  .node[data-s="wait"] .dot { border-color: var(--wait); color: var(--wait); }
  .link[data-s="ok"]  { background: var(--ok); }
  .link[data-s="bad"] { background: repeating-linear-gradient(90deg, var(--bad) 0 4px, transparent 4px 9px); }
  .link[data-s="wait"]::after {
    content: ""; position: absolute; inset: 0; width: 40%;
    background: var(--wait); animation: sweep 1s ease-in-out infinite;
  }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

  h1 { font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; text-align: center; }
  .detail { margin-top: .5rem; font-size: .95rem; color: var(--muted); line-height: 1.5; text-align: center; }
  .am { margin-top: .75rem; font-size: .85rem; color: var(--faint); line-height: 1.65; text-align: center; }

  .btn {
    margin-top: 1.75rem; width: 100%; min-height: 50px;
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    font: 600 .95rem/1 inherit; font-family: inherit;
    color: #fff; background: var(--brand); border: 0; border-radius: 12px; cursor: pointer;
    transition: background .15s, transform .15s;
  }
  @media (prefers-color-scheme: dark) { .btn { color: #082f49; } }
  .btn:hover { background: var(--brand-dark); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .6; cursor: default; transform: none; }
  .btn svg { width: 18px; height: 18px; }
  .btn.busy svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn:focus-visible, .help:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }

  .next { margin-top: .9rem; font-size: .78rem; color: var(--faint); text-align: center; min-height: 1.1em; font-variant-numeric: tabular-nums; }

  .tips {
    margin-top: 1.75rem; padding: 1rem 1.1rem; background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px;
    font-size: .82rem; color: var(--muted); line-height: 1.55;
  }
  .tips[hidden] { display: none; }
  .tips strong { color: var(--ink); font-weight: 650; }
  .tips ul { margin-top: .4rem; padding-left: 1.1rem; }
  .tips li + li { margin-top: .25rem; }

  .help {
    margin: 1.5rem auto 0; display: inline-flex; align-items: center; gap: .4rem;
    font-size: .82rem; font-weight: 600; color: var(--brand); text-decoration: none;
  }
  .help:hover { text-decoration: underline; }
  .help svg { width: 15px; height: 15px; fill: currentColor; }

  /* Still stuck divider */
  .divider {
    margin-top: 1.5rem; position: relative; text-align: center;
  }
  .divider::before {
    content: ""; position: absolute; top: 50%; left: 0; right: 0;
    height: 1px; background: var(--line);
  }
  .divider span {
    position: relative; display: inline-block;
    padding: 0 0.75rem; background: var(--bg);
    font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--faint);
  }

  .support-btn {
    margin-top: 1rem; width: 100%; min-height: 50px;
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    font: 600 .95rem/1 inherit; font-family: inherit;
    color: var(--brand); background: var(--surface);
    border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer;
    text-decoration: none; transition: background .15s, border-color .15s, transform .15s;
  }
  .support-btn:hover { background: rgba(2, 132, 199, 0.05); border-color: var(--brand); }
  .support-btn:active { transform: scale(.98); }
  .support-btn svg { width: 18px; height: 18px; fill: currentColor; }

  footer { padding: 1rem 1.5rem 1.25rem; text-align: center; font-size: .72rem; color: var(--faint); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    .link[data-s="wait"]::after { width: 100%; opacity: .5; }
  }
</style>
</head>
<body>
<main class="stage">

  <div class="path" aria-hidden="true">
    <div class="node" id="nDevice" data-s="wait">
      <div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></div>
      <span class="name">Your device</span>
    </div>
    <div class="link" id="l1" data-s="wait"></div>
    <div class="node" id="nNet" data-s="idle">
      <div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.8 3 2.8 16 0 19M12 2.5c-2.8 3-2.8 16 0 19"/></svg></div>
      <span class="name">Internet</span>
    </div>
    <div class="link" id="l2" data-s="idle"></div>
    <div class="node" id="nSrv" data-s="idle">
      <div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></svg></div>
      <span class="name">MSF server</span>
    </div>
  </div>

  <h1 id="title" role="status" aria-live="polite">Checking connection…</h1>
  <p id="detail" class="detail">Please wait a moment.</p>
  <p id="am" class="am">ግንኙነቱን በማረጋገጥ ላይ ነው። እባክዎ ትንሽ ይጠብቁ።</p>

  <button id="retry" class="btn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    <span id="retryLabel">Try again</span>
  </button>
  <p id="next" class="next"></p>

  <div id="tips" class="tips" hidden></div>

  <!-- Still stuck divider -->
  <div class="divider">
    <span>Still Stuck?</span>
  </div>

  <!-- Contact Support Button -->
  <a class="support-btn" href="https://t.me/Thefluxor" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.52 2.77-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
    <span>Contact Support</span>
  </a>
</main>

<footer>© 2026 Metahara Sugar Factory • Powered by Temesgen</footer>

<script>
(function () {
  var SERVER_URL = "https://house.taild2df63.ts.net";
  var TIMEOUT_MS = 7000;
  var BACKOFF = [6, 10, 15, 30]; // seconds between automatic retries

  var $ = function (id) { return document.getElementById(id); };
  var el = {
    nDevice: $("nDevice"), nNet: $("nNet"), nSrv: $("nSrv"),
    l1: $("l1"), l2: $("l2"),
    title: $("title"), detail: $("detail"), am: $("am"),
    retry: $("retry"), label: $("retryLabel"), next: $("next"), tips: $("tips")
  };

  var attempt = 0, timer = null, checking = false;

  function set(node, s) { node.setAttribute("data-s", s); }
  function paint(s) { // s = [device, link1, net, link2, server]
    set(el.nDevice, s[0]); set(el.l1, s[1]); set(el.nNet, s[2]); set(el.l2, s[3]); set(el.nSrv, s[4]);
  }
  function copy(title, detail, am) {
    el.title.textContent = title; el.detail.textContent = detail; el.am.textContent = am;
  }
  function tips(html) { el.tips.hidden = !html; el.tips.innerHTML = html || ""; }
  function busy(on) {
    el.retry.disabled = on;
    el.retry.classList.toggle("busy", on);
    el.label.textContent = on ? "Checking…" : "Try again";
  }

  function clearTimer() { if (timer) { clearInterval(timer); timer = null; } }
  function scheduleRetry() {
    clearTimer();
    var left = BACKOFF[Math.min(attempt, BACKOFF.length - 1)];
    attempt++;
    el.next.textContent = "Trying again in " + left + "s";
    timer = setInterval(function () {
      left--;
      if (left <= 0) { clearTimer(); check(); return; }
      el.next.textContent = "Trying again in " + left + "s";
    }, 1000);
  }

  function probe() {
    // Resolves only if the server answers; rejects on timeout or network failure.
    var ctrl = typeof AbortController === "function" ? new AbortController() : null;
    var t = setTimeout(function () { if (ctrl) ctrl.abort(); }, TIMEOUT_MS);
    var url = SERVER_URL + "/?_=" + Date.now();
    return Promise.race([
      fetch(url, { mode: "no-cors", cache: "no-store", signal: ctrl ? ctrl.signal : undefined }),
      new Promise(function (_, rej) { setTimeout(function () { rej(new Error("timeout")); }, TIMEOUT_MS + 500); })
    ]).then(function (r) { clearTimeout(t); return r; }, function (e) { clearTimeout(t); throw e; });
  }

  function check() {
    if (checking) return;
    checking = true;
    clearTimer();
    el.next.textContent = "";
    busy(true);
    tips("");

    if (navigator.onLine === false) {
      paint(["bad", "bad", "idle", "idle", "idle"]);
      copy("No internet connection",
           "Your device is not connected. Check Wi-Fi or mobile data.",
           "ኢንተርኔት የለም። Wi-Fi ወይም የሞባይል ዳታ ያብሩ።");
      tips("<strong>What to try</strong><ul><li>Turn on Wi-Fi or mobile data</li><li>Turn off airplane mode</li><li>Move to a place with better signal</li></ul>");
      el.next.textContent = "Waiting for network…";
      busy(false); checking = false;
      // Do NOT schedule a timer — the 'online' event will trigger check() automatically.
      return;
    }

    paint(["ok", "wait", "wait", "idle", "idle"]);
    copy("Connecting to the portal…", "Reaching the MSF server.", "ከሰርቨሩ ጋር በመገናኘት ላይ ነው።");

    probe().then(function () {
      paint(["ok", "ok", "ok", "ok", "ok"]);
      copy("Connected", "Opening the portal…", "ተገናኝቷል። ፖርታሉ በመከፈት ላይ ነው።");
      attempt = 0;
      setTimeout(function () { window.location.replace(SERVER_URL); }, 350);
    }).catch(function () {
      paint(["ok", "ok", "ok", "bad", "bad"]);
      copy("Can’t reach the MSF server",
           "Your internet works, but the server is not responding. It may be restarting or under maintenance.",
           "ኢንተርኔት አለ፤ ሰርቨሩ ግን አልመለሰም። ሰርቨሩ እስኪነሳ ይጠብቁ።");
      tips("<strong>What to try</strong><ul><li>Wait a minute. This page retries on its own</li><li>If it continues, contact IT support</li></ul>");
      busy(false); checking = false; scheduleRetry();
    });
  }

  el.retry.addEventListener("click", function () { attempt = 0; check(); });
  window.addEventListener("online", function () { attempt = 0; check(); });
  window.addEventListener("offline", function () { attempt = 0; checking = false; check(); });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && !checking) { attempt = 0; check(); }
  });

  check();
})();
</script>
</body>
</html>
