<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' https:; img-src 'self' data:; font-src 'none'; object-src 'none'"
    />
    <title>HomeDesk — Connection</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #0b1b2b;
        --muted: #64748b;
        --line: #e6ebf1;
        --brand: #0a4f2c;
        --accent: #0f766e;
        --spinner: #0a4f2c;
        --ok: #047857;
        --warn: #b45309;
        --bad: #be123c;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        color: var(--text);
        background: var(--bg);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Noto Sans Ethiopic",
          Nyala,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        overflow: hidden;
      }
      [hidden] {
        display: none !important;
      }
      .splash {
        position: relative;
        height: 100vh;
        height: 100dvh;
        display: grid;
        grid-template-rows: 1fr auto 1fr;
        align-items: center;
        justify-items: center;
        text-align: center;
        padding: calc(env(safe-area-inset-top, 0px) + clamp(18px, 4vh, 38px))
          clamp(16px, 6vw, 32px)
          calc(env(safe-area-inset-bottom, 0px) + clamp(18px, 4vh, 34px));
        transition:
          opacity 280ms ease,
          transform 280ms ease;
      }
      body.is-leaving .splash {
        opacity: 0;
        transform: scale(0.99);
      }
      .splash::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(
          color-mix(in srgb, var(--brand) 13%, transparent) 1px,
          transparent 1.4px
        );
        background-size: 24px 24px;
        -webkit-mask-image: radial-gradient(
          ellipse 65% 38% at 50% 12%,
          #000 0%,
          transparent 76%
        );
        mask-image: radial-gradient(
          ellipse 65% 38% at 50% 12%,
          #000 0%,
          transparent 76%
        );
        opacity: 0.6;
      }
      .brand,
      .loader,
      .footer {
        position: relative;
        z-index: 1;
      }
      .brand {
        grid-row: 1;
        align-self: start;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .mark {
        position: relative;
        display: grid;
        place-items: center;
        margin-bottom: 12px;
      }
      .mark::before {
        content: "";
        position: absolute;
        width: 190%;
        height: 190%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          color-mix(in srgb, var(--brand) 20%, transparent) 0%,
          transparent 62%
        );
        filter: blur(10px);
        animation: breathe 4.5s ease-in-out infinite;
      }
      .mark svg {
        position: relative;
        width: clamp(62px, 20vw, 88px);
        height: clamp(62px, 20vw, 88px);
        filter: drop-shadow(
          0 10px 22px color-mix(in srgb, var(--brand) 32%, transparent)
        );
        animation: float 5s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.94);
        }
        50% {
          opacity: 1;
          transform: scale(1.06);
        }
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }
      .welcome {
        margin: 0;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .name {
        margin: 6px 0 0;
        font-size: clamp(1.9rem, 9vw, 2.6rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.05;
      }
      .name .home {
        color: #0b2a43;
      }
      .name .desk {
        color: var(--brand);
      }
      .org {
        margin: 9px 0 0;
        font-size: 0.78rem;
        font-weight: 550;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .org::before,
      .org::after {
        content: "";
        display: inline-block;
        width: 20px;
        height: 1px;
        vertical-align: middle;
        background: var(--line);
        margin: 0 9px;
      }
      .loader {
        grid-row: 2;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both;
      }
      .icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        flex: none;
        display: grid;
        place-items: center;
        border: 2px solid currentColor;
        color: var(--brand);
        box-shadow: 0 0 0 9px color-mix(in srgb, var(--brand) 7%, transparent);
      }
      .icon[data-tone="ok"] {
        color: var(--ok);
      }
      .icon[data-tone="warn"] {
        color: var(--warn);
      }
      .icon[data-tone="bad"] {
        color: var(--bad);
      }
      .icon svg {
        width: 48%;
        height: 48%;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon.spin svg {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .state-title {
        margin: 18px 0 0;
        font-size: clamp(1rem, 4.5vw, 1.25rem);
        font-weight: 750;
        letter-spacing: -0.02em;
      }
      .detail {
        margin: 8px 0 0;
        max-width: 320px;
        font-size: clamp(0.78rem, 3.3vw, 0.9rem);
        color: var(--text);
        opacity: 0.88;
      }
      .am {
        margin: 5px 0 0;
        font-size: 0.78rem;
        color: var(--muted);
        line-height: 1.5;
      }
      .bar {
        width: min(180px, 52vw);
        height: 3px;
        margin-top: 18px;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--accent), var(--spinner));
        transition: width 0.4s ease;
      }
      .checks {
        width: min(320px, 82vw);
        text-align: left;
        list-style: none;
        margin: 18px 0 0;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .checks li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        font-size: 0.8rem;
      }
      .checks li + li {
        border-top: 1px solid var(--line);
      }
      .checks small {
        margin-left: auto;
        color: var(--muted);
        font-size: 0.72rem;
        text-align: right;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #9ca3af;
        flex: none;
      }
      li[data-s="ok"] .dot {
        background: var(--ok);
      }
      li[data-s="bad"] .dot {
        background: var(--bad);
      }
      li[data-s="wait"] .dot {
        background: var(--brand);
        animation: pulse 1s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
        width: min(320px, 82vw);
      }
      button,
      a {
        font: inherit;
      }
      .btn {
        flex: 1 1 auto;
        min-height: 42px;
        padding: 0 16px;
        border-radius: 10px;
        border: 1px solid var(--text);
        background: #fff;
        color: var(--text);
        font-weight: 650;
        font-size: 0.86rem;
        cursor: pointer;
      }
      .btn.primary {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .btn:focus-visible,
      .foot a:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--brand) 35%, transparent);
        outline-offset: 2px;
      }
      .next {
        margin: 10px 0 0;
        min-height: 1.2em;
        font-size: 0.76rem;
        color: var(--muted);
      }
      .footer {
        grid-row: 3;
        align-self: end;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        color: var(--muted);
        line-height: 1.5;
      }
      .footer p {
        margin: 0;
      }
      .footer .powered {
        margin-top: 4px;
        font-weight: 700;
        color: var(--brand);
      }
      .footer a {
        color: var(--text);
        font-weight: 600;
        text-decoration: none;
      }
      .footer a:hover {
        text-decoration: underline;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (max-height: 760px) {
        .checks {
          margin-top: 12px;
        }
        .checks li {
          padding: 7px 10px;
        }
        .actions {
          margin-top: 12px;
        }
      }
      @media (max-height: 620px) {
        .mark svg {
          width: 52px;
          height: 52px;
        }
        .name {
          font-size: 1.7rem;
        }
        .org {
          display: none;
        }
        .state-title {
          margin-top: 10px;
        }
        .bar {
          margin-top: 12px;
        }
        .checks {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="splash">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <defs>
              <linearGradient id="houseGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" style="stop-color: var(--brand)" />
                <stop offset="1" style="stop-color: var(--accent)" />
              </linearGradient>
            </defs>
            <path
              d="M6 32 32 9l26 23"
              fill="none"
              stroke="var(--brand)"
              stroke-width="6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M14 33 32 17.5 50 33v19a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4z"
              fill="url(#houseGrad)"
            />
            <rect
              x="26"
              y="38"
              width="12"
              height="18"
              rx="3"
              fill="var(--bg)"
            />
          </svg>
        </div>
        <p class="welcome">Welcome to</p>
        <h1 class="name" aria-label="HomeDesk">
          <span class="home">Home</span><span class="desk">Desk</span>
        </h1>
        <p class="org">Metahara Sugar Factory</p>
      </div>

      <section class="loader">
        <div class="icon" id="icon" data-tone="brand"></div>
        <h2 class="state-title" id="title" role="status" aria-live="polite">
          Checking connection
        </h2>
        <p class="detail" id="detail"></p>
        <p class="am" id="am"></p>

        <div class="bar" aria-hidden="true"><i id="bar"></i></div>

        <ul class="checks">
          <li id="cNet" data-s="idle">
            <span class="dot"></span>Device network<small id="netLabel"
              >—</small
            >
          </li>
          <li id="cWeb" data-s="idle">
            <span class="dot"></span>Internet<small id="webLabel">—</small>
          </li>
          <li id="cApp" data-s="idle">
            <span class="dot"></span>Portal<small id="appLabel">—</small>
          </li>
        </ul>

        <div class="actions">
          <button class="btn primary" id="retry" type="button">
            Try again
          </button>
          <button class="btn" id="force" type="button" hidden>
            Open anyway
          </button>
        </div>
        <p class="next" id="next" aria-live="polite"></p>
      </section>

      <footer class="footer">
        <p>
          © 2026 Metahara Sugar Factory · IT Department ·
          <a
            href="https://t.me/Thefluxor"
            target="_blank"
            rel="noopener noreferrer"
            >Support</a
          >
        </p>
        <p class="powered">Powered By Temesgen G.</p>
      </footer>
    </main>

    <script src="config.js"></script>
    <script>
      (function () {
        "use strict";

        var CONFIG = window.HOMEDESK_CONFIG || {};
        var ORIGIN = CONFIG.serverOrigin || "https://msf-homedesk.vercel.app";
        var CFG = {
          origin: ORIGIN,
          health: CONFIG.healthPath || "/api/mobile/health",
          live: CONFIG.livePath || "/api/health/live",
          start: CONFIG.startPath || "/?app=1",
          internetProbe: "https://www.gstatic.com/generate_204",
          timeout: 5000,
          backoff: [2, 3, 5, 10],
          poll: 2000,
          navMs: 280,
        };

        var splashHidden = false;

        function hideNativeSplash() {
          if (splashHidden) {
            return;
          }
          try {
            var capacitor = window.Capacitor;
            var splash =
              capacitor && capacitor.Plugins && capacitor.Plugins.SplashScreen;
            if (splash && typeof splash.hide === "function") {
              splash.hide();
              splashHidden = true;
            }
          } catch (error) {}
        }

        var ICON = {
          spin: '<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></svg>',
          ok: '<svg viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></svg>',
          off: '<svg viewBox="0 0 24 24"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.52"/><path d="M2 8.82a15 15 0 0 1 4.18-2.64"/><path d="M22 8.82A15 15 0 0 0 10.71 5.06"/><path d="m2 2 20 20"/></svg>',
          warn: '<svg viewBox="0 0 24 24"><path d="M12 8v5m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
        };

        var STATES = {
          checking: {
            title: "Checking connection",
            detail: "Verifying that the portal is reachable.",
            am: "ግንኙነቱን በማረጋገጥ ላይ…",
            icon: ICON.spin,
            tone: "brand",
            spin: true,
            pct: 30,
            net: "ok",
            web: "wait",
            app: "idle",
            busy: true,
          },
          offline: {
            title: "You’re offline",
            detail:
              "Turn on Wi-Fi or mobile data. HomeDesk reconnects automatically.",
            am: "ኢንተርኔት የለም። Wi-Fi ወይም የሞባይል ዳታ ያብሩ።",
            icon: ICON.off,
            tone: "bad",
            pct: 10,
            net: "bad",
            web: "idle",
            app: "idle",
            force: false,
          },
          nointernet: {
            title: "No internet access",
            detail:
              "Your device is connected to a network, but the internet is not reachable.",
            am: "ከኔትወርክ ጋር ተገናኝተዋል፤ ኢንተርኔት ግን አይሰራም።",
            icon: ICON.off,
            tone: "bad",
            pct: 35,
            net: "ok",
            web: "bad",
            app: "idle",
            retry: true,
          },
          down: {
            title: "Portal unavailable",
            detail:
              "The internet works, but the portal is not responding. It may be under maintenance.",
            am: "ፖርታሉ ለጊዜው አልተገኘም። በራስ-ሰር እንደገና ይሞክራል።",
            icon: ICON.warn,
            tone: "warn",
            pct: 60,
            net: "ok",
            web: "ok",
            app: "bad",
            retry: true,
            force: true,
          },
          starting: {
            title: "Portal is starting",
            detail:
              "The portal is reachable but not ready yet. Retrying automatically.",
            am: "ፖርታሉ እየተዘጋጀ ነው። ትንሽ ይጠብቁ።",
            icon: ICON.warn,
            tone: "warn",
            pct: 80,
            net: "ok",
            web: "ok",
            app: "wait",
            retry: true,
            force: true,
          },
          ready: {
            title: "Connected",
            detail: "Opening the portal…",
            am: "ተገናኝቷል። ወደ ፖርታሉ በመግባት ላይ…",
            icon: ICON.ok,
            tone: "ok",
            pct: 100,
            net: "ok",
            web: "ok",
            app: "ok",
            busy: true,
          },
        };

        var $ = function (id) {
          return document.getElementById(id);
        };

        var el = {
          icon: $("icon"),
          title: $("title"),
          detail: $("detail"),
          am: $("am"),
          bar: $("bar"),
          cNet: $("cNet"),
          cWeb: $("cWeb"),
          cApp: $("cApp"),
          netLabel: $("netLabel"),
          webLabel: $("webLabel"),
          appLabel: $("appLabel"),
          retry: $("retry"),
          force: $("force"),
          next: $("next"),
        };

        var attempt = 0;
        var retryTimer = null;
        var runId = 0;
        var opening = false;
        var lastConnected = null;

        function typeLabel(t) {
          if (t === "wifi") return "Wi-Fi";
          if (t === "cellular") return "Mobile data";
          if (t === "ethernet") return "Ethernet";
          if (t === "none") return "No connection";
          return "Connected";
        }

        function browserNet() {
          var online = navigator.onLine !== false;
          var c =
            navigator.connection ||
            navigator.mozConnection ||
            navigator.webkitConnection;
          var t = online ? (c && c.type) || "unknown" : "none";
          return {
            connected: online,
            label: online ? typeLabel(t) : "No connection",
          };
        }

        function getNetwork() {
          var native = window.HomeDeskNative;
          if (native) {
            try {
              var t = native.getType();
              var ok = !!native.isConnected() && t !== "none";
              return Promise.resolve({
                connected: ok,
                label: ok ? typeLabel(t) : "No connection",
              });
            } catch (error) {}
          }
          var cap = window.Capacitor;
          var plugin = cap && cap.Plugins && cap.Plugins.Network;
          if (plugin && typeof plugin.getStatus === "function") {
            return plugin.getStatus().then(
              function (s) {
                return {
                  connected: !!s.connected,
                  label: s.connected
                    ? typeLabel(s.connectionType)
                    : "No connection",
                };
              },
              function () {
                return browserNet();
              },
            );
          }
          return Promise.resolve(browserNet());
        }

        function fetchT(url, opts) {
          var ctrl =
            typeof AbortController === "function"
              ? new AbortController()
              : null;
          var options = { cache: "no-store" };
          for (var k in opts) {
            if (Object.prototype.hasOwnProperty.call(opts, k))
              options[k] = opts[k];
          }
          if (ctrl) options.signal = ctrl.signal;
          var timer;
          var timeout = new Promise(function (_, reject) {
            timer = setTimeout(function () {
              if (ctrl) ctrl.abort();
              reject(new Error("timeout"));
            }, CFG.timeout);
          });
          return Promise.race([fetch(url, options), timeout]).then(
            function (r) {
              clearTimeout(timer);
              return r;
            },
            function (e) {
              clearTimeout(timer);
              throw e;
            },
          );
        }

        function probePortal() {
          var stamp = "?_=" + Date.now();
          return fetchT(CFG.origin + CFG.health + stamp, {
            mode: "cors",
            credentials: "omit",
            headers: { Accept: "application/json" },
          }).then(
            function (res) {
              return res
                .json()
                .catch(function () {
                  return null;
                })
                .then(function (body) {
                  return res.ok && (!body || body.status !== "degraded")
                    ? "ready"
                    : "starting";
                });
            },
            function () {
              return fetchT(CFG.origin + CFG.live + stamp, {
                mode: "no-cors",
                credentials: "omit",
              }).then(
                function () {
                  return "ready";
                },
                function () {
                  return fetchT(CFG.internetProbe + stamp, {
                    mode: "no-cors",
                    credentials: "omit",
                  }).then(
                    function () {
                      return "down";
                    },
                    function () {
                      return "nointernet";
                    },
                  );
                },
              );
            },
          );
        }

        function setCheck(node, value) {
          node.setAttribute("data-s", value);
        }

        function render(name, netLabel) {
          var s = STATES[name];
          el.title.textContent = s.title;
          el.detail.textContent = s.detail;
          el.am.textContent = s.am;
          el.icon.innerHTML = s.icon;
          el.icon.setAttribute("data-tone", s.tone);
          el.icon.classList.toggle("spin", !!s.spin);
          el.bar.style.width = s.pct + "%";
          setCheck(el.cNet, s.net);
          setCheck(el.cWeb, s.web);
          setCheck(el.cApp, s.app);
          if (netLabel) el.netLabel.textContent = netLabel;
          el.webLabel.textContent = {
            ok: "Reachable",
            bad: "Not reachable",
            wait: "Checking…",
            idle: "—",
          }[s.web];
          el.appLabel.textContent = {
            ok: "Ready",
            bad: "Not responding",
            wait: "Starting…",
            idle: "—",
          }[s.app];
          el.retry.disabled = !!s.busy;
          el.retry.textContent = s.busy ? "Checking…" : "Try again";
          el.retry.hidden = name === "ready";
          el.force.hidden = !s.force;
        }

        function clearRetry() {
          if (retryTimer) {
            clearInterval(retryTimer);
            retryTimer = null;
          }
        }

        function scheduleRetry() {
          clearRetry();
          var left = CFG.backoff[Math.min(attempt, CFG.backoff.length - 1)];
          attempt++;
          el.next.textContent = "Retrying in " + left + "s";
          retryTimer = setInterval(function () {
            left--;
            if (left <= 0) {
              clearRetry();
              check();
              return;
            }
            el.next.textContent = "Retrying in " + left + "s";
          }, 1000);
        }

        function openPortal() {
          if (opening) return;
          opening = true;
          document.body.classList.add("is-leaving");
          setTimeout(function () {
            window.location.replace(CFG.origin + CFG.start);
          }, CFG.navMs);
        }

        function check(reset) {
          if (opening) return;
          if (reset) attempt = 0;
          var id = ++runId;
          clearRetry();
          el.next.textContent = "";

          getNetwork().then(function (net) {
            if (id !== runId || opening) return;
            lastConnected = net.connected;
            if (!net.connected) {
              render("offline", net.label);
              el.next.textContent = "Waiting for a network…";
              return;
            }
            render("checking", net.label);
            probePortal().then(function (result) {
              if (id !== runId || opening) return;
              render(result, net.label);
              if (result === "ready") {
                setTimeout(openPortal, 400);
                return;
              }
              scheduleRetry();
            });
          });
        }

        function watch() {
          setInterval(function () {
            if (opening) return;
            getNetwork().then(function (net) {
              if (lastConnected !== null && net.connected !== lastConnected)
                check(true);
            });
          }, CFG.poll);
        }

        window.__homedeskRecheck = function () {
          check(true);
        };
        el.retry.addEventListener("click", function () {
          check(true);
        });
        el.force.addEventListener("click", openPortal);
        window.addEventListener("online", function () {
          check(true);
        });
        window.addEventListener("offline", function () {
          check(true);
        });
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) check(true);
        });

        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            hideNativeSplash();
            setTimeout(hideNativeSplash, 1200);
          });
        });

        render("checking");
        watch();
        check(true);
      })();
    </script>
  </body>
</html>
