<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' https:; img-src 'self' data:; font-src 'none'; object-src 'none'"
    />
    <title>HomeDesk</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #0b1b2b;
        --muted: #64748b;
        --line: #e6ebf1;
        --brand: #0a4f2c;
        --accent: #0f766e;
        --spinner: #0a4f2c;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        color: var(--text);
        background: var(--bg);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Noto Sans Ethiopic",
          Nyala,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        overflow: hidden;
      }
      .splash {
        position: relative;
        height: 100vh;
        height: 100dvh;
        display: grid;
        grid-template-rows: 1fr auto 1fr;
        align-items: center;
        justify-items: center;
        text-align: center;
        padding: calc(env(safe-area-inset-top, 0px) + clamp(18px, 4vh, 38px))
          clamp(16px, 6vw, 32px)
          calc(env(safe-area-inset-bottom, 0px) + clamp(18px, 4vh, 34px));
        transition:
          opacity 280ms ease,
          transform 280ms ease;
      }
      body.is-leaving .splash {
        opacity: 0;
        transform: scale(0.99);
      }
      .splash::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(
          color-mix(in srgb, var(--brand) 13%, transparent) 1px,
          transparent 1.4px
        );
        background-size: 24px 24px;
        -webkit-mask-image: radial-gradient(
          ellipse 65% 38% at 50% 12%,
          #000 0%,
          transparent 76%
        );
        mask-image: radial-gradient(
          ellipse 65% 38% at 50% 12%,
          #000 0%,
          transparent 76%
        );
        opacity: 0.6;
      }
      .brand,
      .loader,
      .footer {
        position: relative;
        z-index: 1;
      }
      .brand {
        grid-row: 1;
        align-self: start;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .mark {
        position: relative;
        display: grid;
        place-items: center;
        margin-bottom: 12px;
      }
      .mark::before {
        content: "";
        position: absolute;
        width: 190%;
        height: 190%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          color-mix(in srgb, var(--brand) 20%, transparent) 0%,
          transparent 62%
        );
        filter: blur(10px);
        animation: breathe 4.5s ease-in-out infinite;
      }
      .mark svg {
        position: relative;
        width: clamp(62px, 20vw, 88px);
        height: clamp(62px, 20vw, 88px);
        filter: drop-shadow(
          0 10px 22px color-mix(in srgb, var(--brand) 32%, transparent)
        );
        animation: float 5s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.94);
        }
        50% {
          opacity: 1;
          transform: scale(1.06);
        }
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }
      .welcome {
        margin: 0;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .name {
        margin: 6px 0 0;
        font-size: clamp(1.9rem, 9vw, 2.6rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.05;
      }
      .name .home {
        color: #0b2a43;
      }
      .name .desk {
        color: var(--brand);
      }
      .org {
        margin: 9px 0 0;
        font-size: 0.78rem;
        font-weight: 550;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .org::before,
      .org::after {
        content: "";
        display: inline-block;
        width: 20px;
        height: 1px;
        vertical-align: middle;
        background: var(--line);
        margin: 0 9px;
      }
      .loader {
        grid-row: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both;
      }
      .spinner {
        --size: 48px;
        position: relative;
        width: var(--size);
        height: var(--size);
      }
      .spinner span {
        position: absolute;
        top: 0;
        left: 50%;
        width: 11%;
        height: 27%;
        margin-left: -5.5%;
        border-radius: 9999px;
        background: var(--spinner);
        transform-origin: 50% calc(var(--size) / 2);
        animation: fade 1s linear infinite;
      }
      .spinner span:nth-child(1) {
        transform: rotate(0deg);
        animation-delay: -1s;
      }
      .spinner span:nth-child(2) {
        transform: rotate(30deg);
        animation-delay: -0.9167s;
      }
      .spinner span:nth-child(3) {
        transform: rotate(60deg);
        animation-delay: -0.8333s;
      }
      .spinner span:nth-child(4) {
        transform: rotate(90deg);
        animation-delay: -0.75s;
      }
      .spinner span:nth-child(5) {
        transform: rotate(120deg);
        animation-delay: -0.6667s;
      }
      .spinner span:nth-child(6) {
        transform: rotate(150deg);
        animation-delay: -0.5833s;
      }
      .spinner span:nth-child(7) {
        transform: rotate(180deg);
        animation-delay: -0.5s;
      }
      .spinner span:nth-child(8) {
        transform: rotate(210deg);
        animation-delay: -0.4167s;
      }
      .spinner span:nth-child(9) {
        transform: rotate(240deg);
        animation-delay: -0.3333s;
      }
      .spinner span:nth-child(10) {
        transform: rotate(270deg);
        animation-delay: -0.25s;
      }
      .spinner span:nth-child(11) {
        transform: rotate(300deg);
        animation-delay: -0.1667s;
      }
      .spinner span:nth-child(12) {
        transform: rotate(330deg);
        animation-delay: -0.0833s;
      }
      @keyframes fade {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.08;
        }
      }
      .status {
        margin: 20px 0 0;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text);
        opacity: 0.88;
      }
      .status::after {
        content: "";
        animation: dots 1.4s steps(4, end) infinite;
      }
      @keyframes dots {
        0% {
          content: "";
        }
        25% {
          content: ".";
        }
        50% {
          content: "..";
        }
        75%,
        100% {
          content: "...";
        }
      }
      .bar {
        width: min(180px, 52vw);
        height: 3px;
        margin-top: 18px;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          var(--spinner),
          transparent
        );
        animation: slide 1.5s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(240%);
        }
      }
      .footer {
        grid-row: 3;
        align-self: end;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        color: var(--muted);
        line-height: 1.5;
      }
      .footer p {
        margin: 0;
      }
      .footer .powered {
        margin-top: 4px;
        font-weight: 700;
        color: var(--brand);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (max-height: 560px) {
        .mark svg {
          width: 52px;
          height: 52px;
        }
        .name {
          font-size: 1.7rem;
        }
        .org {
          display: none;
        }
        .status {
          margin-top: 12px;
        }
        .bar {
          margin-top: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
        .spinner span {
          opacity: 0.6;
        }
        .spinner span:nth-child(1) {
          opacity: 1;
        }
        .status::after {
          content: "...";
        }
        .bar::after {
          transform: translateX(60%);
        }
      }
    </style>
  </head>
  <body>
    <main class="splash">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <defs>
              <linearGradient id="houseGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" style="stop-color: var(--brand)" />
                <stop offset="1" style="stop-color: var(--accent)" />
              </linearGradient>
            </defs>
            <path
              d="M6 32 32 9l26 23"
              fill="none"
              stroke="var(--brand)"
              stroke-width="6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M14 33 32 17.5 50 33v19a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4z"
              fill="url(#houseGrad)"
            />
            <rect
              x="26"
              y="38"
              width="12"
              height="18"
              rx="3"
              fill="var(--bg)"
            />
          </svg>
        </div>
        <p class="welcome">Welcome to</p>
        <h1 class="name" aria-label="HomeDesk">
          <span class="home">Home</span><span class="desk">Desk</span>
        </h1>
        <p class="org">Metahara Sugar Factory</p>
      </div>

      <div class="loader">
        <div class="spinner" role="status" aria-label="Loading">
          <span></span><span></span><span></span><span></span> <span></span
          ><span></span><span></span><span></span> <span></span><span></span
          ><span></span><span></span>
        </div>
        <p class="status">HomeDesk is loading</p>
        <div class="bar" aria-hidden="true"></div>
      </div>

      <footer class="footer">
        <p>© 2026 Metahara Sugar Factory</p>
        <p class="powered">Powered By Temesgen G.</p>
      </footer>
    </main>

    <script src="config.js"></script>
    <script>
      (function () {
        "use strict";

        var CONFIG = window.HOMEDESK_CONFIG || {};
        var ORIGIN = CONFIG.serverOrigin || "https://msf-homedesk.vercel.app";
        var HEALTH = ORIGIN + (CONFIG.healthPath || "/api/mobile/health");
        var LIVE = ORIGIN + (CONFIG.livePath || "/api/health/live");
        var START =
          CONFIG.startupUrl || ORIGIN + (CONFIG.startPath || "/?app=1");
        var TIMEOUT = 5000;
        var RETRY_MS = [1500, 2500, 4000];
        var NAV_MS = 280;
        var OFFLINE_SPIN_MS = 1000;

        var attempt = 0;
        var navigating = false;

        function request(url, options) {
          var ctrl =
            typeof AbortController === "function"
              ? new AbortController()
              : null;
          var timer = setTimeout(function () {
            if (ctrl) ctrl.abort();
          }, TIMEOUT);
          var opts = Object.assign(
            { cache: "no-store", credentials: "omit" },
            options,
          );
          if (ctrl) opts.signal = ctrl.signal;
          return fetch(url, opts).finally(function () {
            clearTimeout(timer);
          });
        }

        function connected() {
          var native = window.HomeDeskNative;
          if (native && typeof native.isConnected === "function") {
            return Promise.resolve(!!native.isConnected());
          }
          var cap = window.Capacitor;
          var plugin = cap && cap.Plugins && cap.Plugins.Network;
          if (plugin && typeof plugin.getStatus === "function") {
            return plugin
              .getStatus()
              .then(function (status) {
                return !!status.connected;
              })
              .catch(function () {
                return navigator.onLine !== false;
              });
          }
          return Promise.resolve(navigator.onLine !== false);
        }

        function probe() {
          return request(HEALTH + "?_=" + Date.now(), {
            mode: "cors",
            headers: { Accept: "application/json" },
          })
            .then(function (res) {
              return res
                .json()
                .catch(function () {
                  return null;
                })
                .then(function (body) {
                  return res.ok && (!body || body.status !== "degraded");
                });
            })
            .catch(function () {
              return request(LIVE + "?_=" + Date.now(), { mode: "no-cors" })
                .then(function () {
                  return true;
                })
                .catch(function () {
                  return false;
                });
            });
        }

        function navigate(url, delay) {
          if (navigating) return;
          navigating = true;
          setTimeout(function () {
            document.body.classList.add("is-leaving");
            setTimeout(function () {
              window.location.replace(url);
            }, NAV_MS);
          }, delay || 0);
        }

        function openPortal() {
          navigate(START);
        }

        function showOffline() {
          navigate("offline.html", OFFLINE_SPIN_MS);
        }

        function check() {
          if (navigating) return;
          probe().then(function (ready) {
            if (navigating) return;
            if (ready) {
              openPortal();
              return;
            }
            connected().then(function (online) {
              if (navigating) return;
              if (!online) {
                showOffline();
                return;
              }
              var wait = RETRY_MS[Math.min(attempt++, RETRY_MS.length - 1)];
              setTimeout(check, wait);
            });
          });
        }

        window.addEventListener("online", function () {
          attempt = 0;
          if (!navigating) check();
        });
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden && !navigating) check();
        });
        window.__homedeskRecheck = function () {
          attempt = 0;
          if (!navigating) check();
        };

        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            var c = window.Capacitor;
            var s = c && c.Plugins && c.Plugins.SplashScreen;
            if (s && typeof s.hide === "function") s.hide();
          });
        });

        connected().then(function (online) {
          if (!online) {
            showOffline();
            return;
          }
          check();
        });
      })();
    </script>
  </body>
</html>
