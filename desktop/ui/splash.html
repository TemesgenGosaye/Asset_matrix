<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starting Msf HomeDesk</title>
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <main class="splash" role="status" aria-live="polite">
      <div class="aurora" aria-hidden="true"></div>
      <div class="grid" aria-hidden="true"></div>

      <section class="content">
        <div class="brand-mark">
          <span class="ring" aria-hidden="true"></span>
          <img src="icon.png" alt="" width="72" height="72" />
        </div>

        <p class="eyebrow">Metahara Sugar Factory</p>
        <h1>Msf HomeDesk</h1>
        <p class="tagline">House Administration Portal</p>

        <div class="progress" aria-hidden="true">
          <span></span>
        </div>
        <p class="status">Establishing secure connection&hellip;</p>
      </section>

      <footer class="splash-footer">
        <span class="badge">SECURE&nbsp;&middot;&nbsp;SIGNED</span>
        <span>Powered by Temesgen G. &middot; IT Department</span>
      </footer>
    </main>
  </body>
</html>
